<div class="p-14 text-center">
  <img class="img-logo" src="assets/images/discartlogo.png" />
  <p class="font-bold text-[30px] text-black mb-20 leading-[1]">
    {{ data.header }}
  </p>
  <p class="font-[20px] text-black">{{ data.message }}</p>
  <button
    mat-flat-button
    [mat-dialog-close]="true"
    [ngClass]="getAlertStatus(data.type)"
    class="rounded-lg mt-5 btn-bright-turquoise"
  >
    {{ data.btnText }}
  </button>
</div>
